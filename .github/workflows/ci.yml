name: CI

on:
  pull_request:
    branches: [ main ]
  # Pushes to main run this suite through release.yml, before any release.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The go.mod minimum and the current release.
        go: [ go.mod, stable ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          check-latest: true
      - run: go vet ./...
      - run: go test -race -shuffle=on -count=1 ./...
      - name: Fuzz smoke test
        run: go test -run='^$' -fuzz=FuzzParseDecode -fuzztime=30s ./inform

  gofix:
    name: go fix is clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - run: go fix ./...
      - name: Fail if go fix changed anything
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::'go fix' produced changes. Run it locally and commit the result."
            git --no-pager diff
            exit 1
          fi

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...
