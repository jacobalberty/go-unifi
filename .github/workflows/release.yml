name: Release

# Every push to main runs CI and then releases automatically when the
# conventional commits since the last tag call for it (see
# .github/scripts/next-version.sh): it tags the commit and publishes a
# GitHub release with notes generated by git-cliff (cliff.toml).
#
# Run it by hand (workflow dispatch) with a version to cut a release the
# script will not, e.g. v1.0.0.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (vX.Y.Z). Leave empty to compute it.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT" ]; then
            v="$INPUT"
          else
            v=$(.github/scripts/next-version.sh HEAD)
          fi
          if [ -z "$v" ]; then
            echo "No feat, fix, perf or breaking commits since the last release; nothing to release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! [[ "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$v' is not a valid vX.Y.Z version"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            echo "::error::tag $v already exists"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Releasing $v" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate release notes
        if: steps.version.outputs.version != ''
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ steps.version.outputs.version }} --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Tag and publish
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$VERSION" --title "$VERSION" --notes-file RELEASE_NOTES.md --verify-tag "${prerelease[@]}"
